[package]
name = "nagi-tui"
description = "Application and runtime facade for Nagi TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"

[dependencies]
nagi-content = { path = "../nagi-content", version = "0.2.7" }
nagi-surface = { path = "../nagi-surface", version = "0.2.7" }
nagi-text = { path = "../nagi-text", version = "0.2.7" }
nagi-vt = { path = "../nagi-vt", version = "0.2.7" }

[[bench]]
name = "scroll_viewport"
harness = false

[[bench]]
name = "content_projection"
harness = false

[[bench]]
name = "clipboard"
harness = false

[[bench]]
name = "pointer_selection"
harness = false

[[bench]]
name = "terminal_task"
harness = false
